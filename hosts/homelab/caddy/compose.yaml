services:
  caddy:
    container_name: caddy
    image: caddy:2-alpine
    restart: unless-stopped
    cap_add:
      # Perform various network-related operations
      # https://man7.org/linux/man-pages/man7/capabilities.7.html
      - NET_ADMIN
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
volumes:
  caddy_data: null
  caddy_config: null
networks:
  proxy:
    name: proxy
